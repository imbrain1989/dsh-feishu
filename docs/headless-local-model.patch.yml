# headless profile 本地 MTP 模型配置(参考副本 —— 当前未应用)
# ⚠️ 当前状态:飞书机器人默认使用 DeepSeek API(headless 的 cordis.patch.yml = [])。
#    本文件是"临时切到本地 MTP 模型"的可选配置;如需应用,把内容复制到
#    $DSH_HOME/profiles/headless/cordis.patch.yml;切回 DeepSeek API 时还原为 []。
# 作用:让 Feishu 机器人的 DSH 智能体使用本机 LM Studio 的 MTP 模型,不受全局 settings 默认模型影响。
# 参数按本机显存/内存调优(16K 上下文),可按自己的硬件调整 contextWindow / maxTokens
#
# 前置:
#   1. LM Studio 已启动并加载 qwen3.6-35b-a3b-mtp,本地 API 服务(默认 127.0.0.1:1234)
#   2. 凭证文件 $DSH_HOME/.credentials.yaml 的 refs 下有 Q38_API_KEY
#   3. headless profile 存在(见 README"dsh 模式前置")
- id: settings
  name: '@deepseek-ai/dsh-settings-file'
  disabled: true

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      q38:
        displayName: 本地 LM Studio (MTP)
        apiKeyEnv: Q38_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:1234/v1
        models:
          - id: qwen3.6-35b-a3b-mtp
            name: Qwen3.6-35B-A3B-MTP
            contextWindow: 16384
            maxTokens: 8192
            input: [text]

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: q38
    model: qwen3.6-35b-a3b-mtp
